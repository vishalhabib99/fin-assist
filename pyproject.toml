[project]
name = "retirement-answer-check"
version = "0.3.0"
description = "Checks AI-drafted answers to US retirement-account questions before they reach a customer: SEND or REVIEW, with an IRS or FINRA source for every flag."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=2.0"]

[project.scripts]
retirement-answer-check = "retirement_answer_check.server:main"
fin-doctor = "retirement_answer_check.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retirement_answer_check"]

[tool.hatch.build.targets.wheel.force-include]
"data/facts.json" = "retirement_answer_check/facts.json"
"registry" = "retirement_answer_check/registry_data"
