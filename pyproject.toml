[project]
name = "fin-assist"
version = "0.3.0"
description = "Checks AI-drafted answers to US retirement-account questions before they reach a customer: SEND or REVIEW, with an IRS or FINRA source for every flag."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=2.0"]

[project.scripts]
fin-assist-mcp = "fin_assist.server:main"
fin-assist = "fin_assist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_assist"]

[tool.hatch.build.targets.wheel.force-include]
"data/facts.json" = "fin_assist/facts.json"
"registry" = "fin_assist/registry_data"
