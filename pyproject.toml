[project]
name = "fin-assist"
version = "0.4.5"
description = "Catch stale and wrong money figures in an AI agent's answer before a customer sees them: every IRS and SSA figure checked against a year-stamped, sourced registry."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=2.0"]
authors = [{ name = "Vishal Habib" }]
keywords = ["ai-agents", "guardrails", "llm", "mcp", "fintech", "irs", "retirement", "evals"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/vishalhabib99/fin-assist"
Issues = "https://github.com/vishalhabib99/fin-assist/issues"
Calculator = "https://vishalhabib99.github.io/fin-assist/room/"

[project.scripts]
fin-assist-mcp = "fin_assist.server:main"
fin-assist = "fin_assist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_assist"]

[tool.hatch.build.targets.wheel.force-include]
"data/facts.json" = "fin_assist/facts.json"
"registry" = "fin_assist/registry_data"
